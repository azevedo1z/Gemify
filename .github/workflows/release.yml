name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check that the tag matches the version of pubspec.yaml
        run: |
          version="$(sed -nE 's/^version: *([^+]+).*/\1/p' pubspec.yaml)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the version $version of pubspec.yaml."
            exit 1
          fi
      - name: Build the release notes from the commits
        run: bash tool/release_notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
      - name: Create the GitHub Release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Gemify $GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
