name: Bug report
description: Report something that does not work as expected.
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Never paste real financial data or a real backup file. For security issues, follow the [security policy](https://github.com/azevedo1z/offmoney/blob/master/SECURITY.md) instead.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the month screen
        2. Tap ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Month screen
        - Expense form
        - Month close
        - History
        - Share
        - Backup export or import
        - Calculation or audit line
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: '0.1.0'
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: 'Moto G35, Android 15'
